<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - EventBooking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .booking-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .booking-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status-badge.CONFIRMED {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        .status-badge.HELD {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        .status-badge.CANCELLED {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="navbar-brand">EventBooking</a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="container">
        <h2 class="mb-2">My Bookings</h2>
        <div id="alert" class="alert"></div>
        <div id="bookingsList">
            <!-- Bookings injected here -->
        </div>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        async function loadMyBookings() {
            if (!isAuthenticated()) {
                window.location.href = '/login.html';
                return;
            }

            showLoader();
            try {
                const bookings = await apiFetch('/bookings/my-bookings');
                
                const list = document.getElementById('bookingsList');
                list.innerHTML = '';
                
                if (bookings.length === 0) {
                    list.innerHTML = '<div class="glass-card text-center"><p>You have no bookings yet.</p><a href="/index.html" class="btn btn-primary mt-1">Discover Events</a></div>';
                    return;
                }

                // Note: The backend currently returns bookings with eventId, but we might want event details.
                // For a more complete UI, we could fetch event details for each, but we'll show what's available.
                for (const booking of bookings) {
                    // Fetch event details to show title
                    let eventTitle = 'Event ' + booking.eventId.substring(0, 8);
                    try {
                        const event = await apiFetch(`/events/${booking.eventId}`);
                        eventTitle = event.title;
                    } catch(e) {
                        console.error('Could not fetch event for booking', e);
                    }

                    const card = document.createElement('div');
                    card.className = 'glass-card booking-card';
                    
                    const date = new Date(booking.bookingTime).toLocaleString();
                    
                    card.innerHTML = `
                        <div>
                            <h3 class="mb-1">${eventTitle}</h3>
                            <p style="margin-bottom: 0.25rem;"><strong>Booking ID:</strong> ${booking.id}</p>
                            <p style="margin-bottom: 0.25rem;"><strong>Tickets:</strong> ${booking.seatsBooked}</p>
                            <p style="font-size: 0.9rem;">Booked on: ${date}</p>
                        </div>
                        <div style="text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1rem;">
                            <span class="status-badge ${booking.status}">${booking.status}</span>
                            <strong style="font-size: 1.25rem; color: var(--accent-primary);">$${booking.totalPrice.toFixed(2)}</strong>
                            ${booking.status === 'HELD' ? `<a href="/checkout.html?bookingId=${booking.id}" class="btn btn-primary" style="padding: 0.5rem 1rem;">Pay Now</a>` : ''}
                        </div>
                    `;
                    list.appendChild(card);
                }
            } catch (error) {
                showAlert('Failed to load bookings: ' + error.message, 'error');
            } finally {
                hideLoader();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMyBookings();
        });
    </script>
</body>
</html>
