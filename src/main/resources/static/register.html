<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventBooking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="navbar-brand">EventBooking</a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="container flex-center">
        <div class="glass-card" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-2">Create an Account</h2>
            <div id="alert" class="alert"></div>
            
            <form id="registerForm">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="Enter your full name">
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Create a password">
                </div>

                <div class="input-group">
                    <label for="role">Role</label>
                    <select id="role" required>
                        <option value="USER">Standard User</option>
                        <option value="ORGANIZER">Event Organizer</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mt-1">Register</button>
            </form>
            
            <p class="text-center mt-2" style="font-size: 0.9rem;">
                Already have an account? <a href="/login.html" style="color: var(--accent-primary);">Sign In</a>
            </p>
        </div>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            showLoader();
            try {
                await apiFetch('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, email, password, role })
                });
                
                showAlert('Registration successful! Please login.', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (error) {
                showAlert(error.message, 'error');
            } finally {
                hideLoader();
            }
        });
    </script>
</body>
</html>
