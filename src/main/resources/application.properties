spring.application.name=EventBookingSystem

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/eventbooking
# Required: enables auto-creation of indexes from @Indexed / @GeoSpatialIndexed annotations
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Dummy Mail Configuration (for testing)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=testuser
spring.mail.password=testpass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Jackson: serialize LocalDateTime as ISO-8601 string (not array) so JS new Date() works correctly
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
