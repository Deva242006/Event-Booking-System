spring.application.name=EventBookingSystem

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Event?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Deva@#2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Server Configuration
server.port=8080

# Logging


# Dummy Mail Configuration (for testing)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=testuser
spring.mail.password=testpass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Jackson: serialize LocalDateTime as ISO-8601 string (not array) so JS new Date() works correctly
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
